<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact · Ember Xiong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Archivo+Expanded:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="wrap">
    <a href="index_en.html" class="nav-logo">EMBER XIONG</a>
    <div class="nav-right">
      <div class="nav-links">
        <a href="about_en.html">About</a>
        <a href="services_en.html">Services</a>
        <a href="portfolio_en.html">Portfolio</a>
        <a href="contact_en.html" class="active">Contact</a>
      </div>
      <div class="nav-lang"><a href="contact.html">中文</a></div>
      <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<div class="wrap">
  <main>
    <div class="contact-box">
      <h2>Let's make some noooise!🎮</h2>
      <p class="sub">For freelance / collaboration / project inquiries:</p>
      <a class="contact-email" href="mailto:emberxb@outlook.com">emberxb@outlook.com</a>

      <form class="contact-form" action="https://formspree.io/f/mvkpvgzy" method="POST">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="form-submit">Send</button>
        <div class="form-note">Sent directly to my inbox — I'll get back to you as soon as I can.</div>
      </form>
    </div>
  </main>
</div>

<footer class="site-footer">
  <div class="wrap"><div class="colophon">Ember Xiong — Game Sound Designer</div></div>
</footer>

<script src="script.js"></script>
</body>
</html>
